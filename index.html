<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.18/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/1.9.1/showdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Job Seeker Assistant</h1>

        <div class="tabs flex border-b">
            <button class="tab-button flex-1 py-2 px-4 text-center font-semibold text-gray-600 bg-white border-b-2 border-transparent hover:bg-gray-200 active-tab" data-tab="job-search">Job Search</button>
            <button class="tab-button flex-1 py-2 px-4 text-center font-semibold text-gray-600 bg-white border-b-2 border-transparent hover:bg-gray-200" data-tab="ai-resume">AI Resume</button>
            <button class="tab-button flex-1 py-2 px-4 text-center font-semibold text-gray-600 bg-white border-b-2 border-transparent hover:bg-gray-200" data-tab="market-insights">Market Insights</button>
        </div>

        <div id="job-search" class="tab-content p-6 bg-white rounded-b-lg shadow-md">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Find Your Next Job</h2>
            <form id="job-search-form" class="space-y-4">
                <div>
                    <label for="keywords" class="block text-sm font-medium text-gray-700">Job Title or Keywords</label>
                    <input type="text" id="keywords" name="keywords" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="e.g., Software Engineer">
                </div>
                <div>
                    <label for="date-posted" class="block text-sm font-medium text-gray-700">Date Posted</label>
                    <select id="date-posted" name="date-posted" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                        <option value="300">5 minutes</option>
                        <option value="900">15 minutes</option>
                        <option value="1800">30 minutes</option>
                        <option value="3600">1 hour</option>
                        <option value="7200">2 hours</option>
                        <option value="14400">4 hours</option>
                        <option value="28800">8 hours</option>
                        <option value="86400" selected>24 hours</option>
                        <option value="604800">7 days</option>
                    </select>
                </div>
                <div>
                    <label for="location" class="block text-sm font-medium text-gray-700">Location (Optional)</label>
                    <input type="text" id="location" name="location" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="e.g., San Francisco, CA">
                </div>
                <div>
                    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Search on LinkedIn
                    </button>
                </div>
            </form>
        </div>

        <div id="ai-resume" class="tab-content hidden p-6 bg-white rounded-b-lg shadow-md">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">AI Resume Analyzer</h2>
            <div class="space-y-4">
                <div>
                    <label for="resume-file" class="block text-sm font-medium text-gray-700">Upload Resume (.pdf, .docx, .txt)</label>
                    <input type="file" id="resume-file" name="resume-file" accept=".pdf,.docx,.txt" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div>
                    <label for="target-role" class="block text-sm font-medium text-gray-700">Target Job Role</label>
                    <input type="text" id="target-role" name="target-role" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="e.g., Product Manager">
                </div>
                <div>
                    <button id="analyze-resume-btn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Analyze Resume
                    </button>
                </div>
                <div id="resume-results" class="mt-6 hidden">
                    <div id="resume-spinner" class="flex justify-center items-center">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                        <p class="ml-2">Analyzing...</p>
                    </div>
                    <div id="resume-output" class="prose max-w-none"></div>
                </div>
            </div>
        </div>

        <div id="market-insights" class="tab-content hidden p-6 bg-white rounded-b-lg shadow-md">
            <h2 class="text-2xl font-semibold mb-4 text-gray-700">Job Market Insights</h2>
            <div class="space-y-4">
                <div>
                    <label for="insights-job-role" class="block text-sm font-medium text-gray-700">Job Role</label>
                    <input type="text" id="insights-job-role" name="insights-job-role" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="e.g., Data Scientist">
                </div>
                <div>
                    <button id="get-insights-btn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Get Market Insights
                    </button>
                </div>
                <div id="insights-results" class="mt-6 hidden">
                    <div id="insights-spinner" class="flex justify-center items-center">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                        <p class="ml-2">Fetching market data...</p>
                    </div>
                    <div id="insights-output" class="space-y-6">
                        <div id="insights-summary" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <!-- Summary Cards Go Here -->
                        </div>
                        <div id="skills-chart-container" class="mt-6">
                             <h3 class="text-xl font-semibold text-gray-800 mb-4 text-center">Top In-Demand Skills</h3>
                            <canvas id="skills-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
